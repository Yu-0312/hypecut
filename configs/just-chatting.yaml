# Talk-heavy streams, podcasts, reaction content.
#
# There is no HUD and the camera barely moves, so every visual signal is
# dropped and the whole decision rests on voice. Longer clips, because a
# funny bit needs its setup.
profile: just-chatting

signals:
  enabled: [audio_rms, audio_transient, speech_band, scene_change]
  weights:
    audio_rms: 1.0
    audio_transient: 0.8
    speech_band: 1.5
    scene_change: 0.2
  smooth_seconds: 3.0

segments:
  min_duration: 10.0
  max_duration: 45.0
  pre_roll: 8.0
  post_roll: 4.0
  merge_gap: 6.0
  percentile: 90.0
  # No cap: a long recording spills into part 2, part 3 ... rather than
  # silently losing its second half. `clips_per_reel` sets how big each is.
  max_clips: 0
  target_duration: 240.0
  snap_to_shots: false    # a single locked-off camera has no cuts to snap to
  trim_to_silence: true   # ...so the pauses between sentences are all we have
  min_silence: 0.35       # a beat between thoughts, not a breath between words
  silence_window: 3.0     # long pre-roll here, so let the edge travel to match
  silence_pad: 0.20

# `similarity` is deliberately absent: one person at one desk means every
# clip has the same motion signature, so it would read the whole stream as
# a single repeated moment. It needs footage whose shots actually differ.
refiners: [diversity, pacing, speech_keywords]
refiner_params:
  pacing:
    ideal: 25.0
    tolerance: 12.0
