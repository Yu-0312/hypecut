# MOBAs (League of Legends, Dota 2).
#
# Fights build slowly and pay off over 10-20 seconds, so clips are longer and
# the pre-roll is generous. The kill feed sits top-centre/right and the
# scoreboard changes on every takedown, so two ROIs are worth more than raw
# motion — the camera pans constantly and motion alone is near-useless.
profile: moba

signals:
  enabled: [audio_rms, audio_transient, speech_band, scene_change, roi_activity]
  weights:
    audio_rms: 1.0
    audio_transient: 1.1
    speech_band: 0.9          # caster hype is the strongest MOBA signal
    scene_change: 0.4
    roi_activity: 1.3
  params:
    roi_activity:
      box: [0.35, 0.0, 0.99, 0.12]   # top bar: score + kill feed
      threshold: 6
  smooth_seconds: 2.5

segments:
  min_duration: 8.0
  max_duration: 26.0
  pre_roll: 6.0               # the engage matters as much as the kill
  post_roll: 4.0
  merge_gap: 5.0
  percentile: 93.0
  # No cap: a long recording spills into part 2, part 3 ... rather than
  # silently losing its second half. `clips_per_reel` sets how big each is.
  max_clips: 0
  target_duration: 180.0
  snap_window: 4.0        # camera jumps to the fight; that jump is the cut

refiners: [diversity, pacing, similarity]
refiner_params:
  pacing:
    ideal: 15.0
    tolerance: 7.0
  diversity:
    min_gap: 120.0
