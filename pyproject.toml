[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hypecut"
version = "0.6.0"
description = "Automatic highlight reels for gameplay, esports and sports — upload a video, get the good parts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "HypeCut contributors" }]
keywords = ["video", "highlights", "esports", "gaming", "sports", "ffmpeg", "editing", "vod"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]
ml = [
  "torch>=2.1",
  "open_clip_torch>=2.24",
  "Pillow>=10.0",
]
asr = [
  "faster-whisper>=1.0",
]
dev = [
  "pytest>=8.0",
  "Pillow>=10.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]
all = ["hypecut[web,ml,asr]"]

[project.urls]
Homepage = "https://github.com/hypecut/hypecut"
Documentation = "https://github.com/hypecut/hypecut#readme"
Issues = "https://github.com/hypecut/hypecut/issues"
Source = "https://github.com/hypecut/hypecut"

[project.scripts]
hypecut = "hypecut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypecut"]

[tool.hatch.build.targets.sdist]
include = ["src/hypecut", "configs", "tests", "docs", "skill", "README.md", "AGENTS.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# ffmpeg invocations read far better as compact argument lists than as one
# token per line, and a trailing comma should not force the explosion.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# Must match format.skip-magic-trailing-comma above, or the two fight.
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ffmpeg: requires the ffmpeg binary"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
